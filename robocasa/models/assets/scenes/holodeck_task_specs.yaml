      remove_scene_bodies:
        - laptop_6ae82082b761fc8537b74b4d805f7cb1_1_0_0
      robot_pose:
        # Stand directly in front of the ice cube and face it (+X).
        pos: [4.95, 4.45, 0.0]
        yaw: 0.0
      object_scale: 1.52
      cup_pose:
        # Keep the cup close to the ice while leaving both objects separately graspable.
        pos: [5.45, 4.60, 0.7773]
        quat: [1.0, 0.0, 0.0, 0.0]
      ice_pose:
        pos: [5.45, 4.45, 0.72108]
        quat: [1.0, 0.0, 0.0, 0.0]
      box_pose:
        # Grounded beside the window-side dining table and close to the wall.
        pos: [4.3, 0.60, 0.1580]
        quat: [0.707107, 0.707107, 0.0, 0.0]

