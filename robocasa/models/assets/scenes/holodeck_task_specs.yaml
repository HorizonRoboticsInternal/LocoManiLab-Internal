default_asset_layouts:
  # Desk-independent tasks still need a collision-safe, visually stable desk
  # asset layout when these scenes are loaded.
  train_1664: open_laptop
  train_2025: open_laptop

scenes:
  train_1477:
    approach_trash_can_then_lift_plant_then_place_plant_in_trash_can:
      trash_can_body: holodeck1477_plant_workflow_trash_can
      # Beside the atomic plant, shifted toward the robot to clear the tables.
      bin_pos: [1.20, 5.0, 0.0]
      robot_pose:
        # Remote open floor, facing the plant-side bin.
        pos: [0.75, 3.80, 0.0]
        yaw: 1.5707963267948966
      # Native scene-117 bin, Y-up in its body frame; include 5 mm clearance.
      bin_inner_min: [-0.155, 0.075, -0.155]
      bin_inner_max: [0.155, 0.61, 0.155]
      # Shortest robot-to-bin collision distance for the first stage.
      success_radius: 0.35

    lift_plant_from_low_cabinet:
      # Clear the low object beneath the robot's approach to the side table.
      remove_scene_bodies:
        - obja_b183e6af5d324e03913a4ca835fb291d_1_0_0
      # The round side table nearest the leftmost window.
      source_body: stand_007a3ac7acf8cfc943375cf9dded27c1_1_0_0
      target_body: houseplant_70451f91981395edf773114de3a28b67_1_0_0
      target_pose:
        # Place the existing plant near the robot-facing edge of the table.
        pos: [0.75, 5.4, 0.66533]
        quat: [0.230209, 0.230210, 0.668581, 0.668585]
      robot_pose:
        # Stand closer to the south edge, facing the plant along +Y.
        pos: [0.75, 5.05, 0.0]
        yaw: 1.5707963267948966

    cube_in_plate:
      # Keep only the target plate on the coffee table for this task.
      remove_scene_bodies:
        - plate_f61129d9e389712b24d18993ffe91ff5_2_0_0
      target_body: obja_a04ff652820c465da4ba7a427fd34417_1_0_0
      target_pose:
        # Cube and plate sit side by side near the table's -Y edge.
        pos: [4.65, 5.20, 0.608939]
        quat: [-0.116693, -0.116692, 0.69741, 0.697413]
      plate_body: plate_f61129d9e389712b24d18993ffe91ff5_1_0_0
      plate_pose:
        pos: [4.40, 5.28, 0.591055]
        quat: [0.700225, 0.700225, -0.0984102, -0.0984102]
      table_body: coffeetable_b3f143252f435a2cbc346ca9563926cf_1_0_0
      robot_pose:
        pos: [4.50, 4.80, 0.0]
        yaw: 1.5707963267948966

    approach_window_then_cube_in_plate_then_open_laptop:
      # The north-wall row, viewed from inside the room facing +Y.
      window_body: window_76ae12c4dabc4895be686fe9df54801e_3_0_0
      robot_pose:
        # Reuse the clear floor area opposite the windows, facing the target.
        pos: [5.45, 1.65, 0.0]
        yaw: 1.5707963267948966
      success_radius: 0.65
      laptop_pose:
        # Original scene-117 Laptop_26, on the cube's unchanged coffee table.
        # Base bottom at z=0.577465, matching the baked collision tabletop.
        pos: [4.90, 5.3, 0.652345]
        quat: [0.7071067811865476, 0.7071067811865476, 0.0, 0.0]

  train_117:
    pick_book_from_dresser:
      # Original book on the side table by the window.
      source_body: stand_accd13ef606f3a2fbd33b6c6efb9184a_1_0_0
      target_body: obja_229c536a8d6b445f8a21cf73f6c6dce9_1_0_0
      robot_pose:
        # 0.10 m shortest collision distance from the G1 to the source table.
        pos: [5.19421348, 3.30, 0.0]
        yaw: 0.0
      # The baked book is narrower and lighter for a stable G1 grasp.
      book_scale: [0.55, 1.0, 1.0]
      book_density: 180.0
      # Uniformly enlarge the side table around its foot plane. This raises
      # the tabletop while preserving the original proportions and footprint.
      source_table_scale: 1.2
      book_pose:
        # The scaled table top is at z ~= 0.620; preserve the original book
        # to surface clearance so the book starts supported, not suspended.
        # Move it 5 cm farther along the robot's +X viewing direction.
        pos: [5.54421348, 3.30, 0.748084]
        quat: [0.304415, 0.30442, -0.638221, -0.638227]
      lift_delta: 0.15

    pick_book_to_desk:
      desk_body: desk_aeb6ab35aea76da67db0d3cd45d3e821_1_0_0
      success_radius: 1.0

    approach_trash_can:
      trash_can_body: holodeck117_trash_can
      robot_pose:
        # Start 0.5 m farther along the trash-can-to-start direction and face
        # the trash can directly.
        pos: [3.976562, 4.951290, 0.0]
        yaw: -2.834195180466972
      composite_robot_pose:
        # Start in the room corner opposite the desk and face the trash can.
        pos: [0.6, 0.6, 0.0]
        yaw: 1.648762960626439
      # The desk/laptop/trash composite starts by approaching the desk.
      desk_composite_robot_pose:
        pos: [0.6, 0.6, 0.0]
        yaw: 0.6921691387270338
      success_radius: 1.0

    approach_window:
      # Rightmost window in the east-wall row; collision geometry is in the baked XML.
      window_body: window_8d46bf775284cf92b31bf5fe02ddd4b4_3_0_0
      lang: "walk to the rightmost window and stand nearby"
      robot_pose:
        # Start on the opposite side of the room.
        pos: [0.6, 0.6, 0.0]
        yaw: 0.0459877383419593
      # The desk/laptop/window composite starts from this remote floor pose;
      # the atomic window pose is also safely outside the desk region.
      composite_robot_pose:
        pos: [0.6, 0.6, 0.0]
        # Face the desk for the first navigation stage.
        yaw: 0.6921691387270338
      success_radius: 1.2

    throw_bottle_into_trash_can:
      trash_can_body: holodeck117_trash_can
      replaced_body: chair_3cd00cb1e425e822898c02ccf4e6984f_3_0_0
      source_body: holodeck117_bottle_source_table
      source_table_pose:
        # Move the side table toward the nearby trash can while keeping a
        # clear gap between their floor collision geometries.
        pos: [0.50, 4.20, 0.0]
        yaw: 0.0
      source_surface_z: 0.70
      source_table_half_size: [0.25, 0.20]
      robot_pose:
        # 0.10 m shortest collision distance from the G1 to the source table.
        pos: [1.09107319, 4.15392845, 0.0]
        # Face the bottle at the robot-facing (+X) table edge.
        yaw: 3.075024489813971
      bottle_scale: 1.4
      bottle_pose:
        # Keep the source bottle 0.45 m horizontally in front of the G1.
        pos: [0.64206987, 4.18386200, 0.7773]
        quat: [1.0, 0.0, 0.0, 0.0]

    pick_box_from_floor:
      # Open floor in the center of the office, clear of the baked furniture.
      room_id: 0
      robot_pose:
        pos: [2.30, 3.00, 0.0]
        yaw: 0.0
      box_scale: 2.0
      box_pose:
        # Approximate doubled Box_19 root height; reset snaps its compiled
        # lowest geometry exactly to the floor.
        pos: [3.00, 3.00, 0.1580]
        # Rotate the prefab's +Y opening normal to world +Z (up).
        quat: [0.707107, 0.707107, 0.0, 0.0]

    approach_window_then_pick_box:
      # Put the box on the floor beside the window-side dining table.
      box_pose:
        pos: [4.30, 0.60, 0.1580]
        quat: [0.707107, 0.707107, 0.0, 0.0]

    place_box_on_floor:
      room_id: 0
      table_body: desk_aeb6ab35aea76da67db0d3cd45d3e821_1_0_0
      robot_pose:
        # Keep the larger box outside the G1 spawn collision envelope.
        pos: [4.74990582, 4.8, 0.0]
        yaw: 0.0
      box_scale: 2.0
      box_pose:
        # Upright Box_19 rests on the desk top at approximately z=0.70.
        # Raise the root 2 cm to avoid the baked desk collision slab while
        # retaining a shallow stabilizing contact on the tabletop.
        pos: [5.44990582, 4.8, 1.0000]
        quat: [0.707107, 0.707107, 0.0, 0.0]
      remove_scene_bodies:
        - laptop_6ae82082b761fc8537b74b4d805f7cb1_1_0_0

    place_box_on_desk:
      room_id: 0
      table_body: desk_aeb6ab35aea76da67db0d3cd45d3e821_1_0_0
      robot_pose:
        # Stand beside the desk and face south toward the floor box.
        pos: [4.90, 4.50, 0.0]
        yaw: -1.5707963267948966
      box_scale: 1.75
      box_pose:
        # Keep the source box on the floor, 70 cm in front of the robot.
        pos: [4.90, 3.80, 0.1580]
        quat: [0.5, 0.5, 0.5, 0.5]
      remove_scene_bodies:
        - laptop_6ae82082b761fc8537b74b4d805f7cb1_1_0_0


