      table_body: desk_aeb6ab35aea76da67db0d3cd45d3e821_1_0_0
      robot_pose:
        pos: [4.95, 4.8, 0.0]
        yaw: 0.0
      object_scale: 1.52
      cup_pose:
        pos: [5.45, 4.8, 0.7773]
        quat: [1.0, 0.0, 0.0, 0.0]
      # Keep the ice close to the cup while leaving the two objects separately
      # graspable from the near desk edge.
      ice_pose:
        pos: [5.45, 4.65, 0.72108]
        quat: [1.0, 0.0, 0.0, 0.0]

    ice_cube_then_approach_window_then_pick_box:
      # This composite uses the calibrated office desk, not the dining table
      # used by the standalone ice-cube task.  The laptop is removed so the
      # cup and ice have a clear, shared tabletop workspace.
