name: CPU package checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel-resources:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install minimal CPU build and test tools
        run: python -m pip install build numpy scipy pytest
      - name: Build and install the wheel without runtime dependencies
        run: |
          python -m build --wheel --outdir "$RUNNER_TEMP/g1-backend-dist"
          python -m pip install --no-deps "$RUNNER_TEMP"/g1-backend-dist/*.whl
      - name: Exercise packaged FK resources outside the checkout
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/g1-backend-wheel-smoke"
          cp tests/test_package_resources.py "$RUNNER_TEMP/g1-backend-wheel-smoke/"
          cd "$RUNNER_TEMP/g1-backend-wheel-smoke"
          unset PYTHONPATH
          python -I - <<'PY'
          from pathlib import Path
          import sysconfig
          import g1_bridge.recording.g1_fk as fk

          installed = Path(fk.__file__).resolve()
          site_packages = Path(sysconfig.get_path('purelib')).resolve()
          assert installed.is_relative_to(site_packages), installed
          print(f'Testing installed module: {installed}')
          PY
          python -I -m pytest -q test_package_resources.py
